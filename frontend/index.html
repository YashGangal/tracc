<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracc — AI Logistics Operations Copilot</title>
    <meta name="description" content="Enterprise logistics operations command center with real-time KPI tracking, ML late-delivery risk predictions, SHAP explainability, automated alerts, and AI copilot." />
    <meta property="og:title" content="Tracc — AI Logistics Operations Copilot" />
    <meta property="og:description" content="Enterprise logistics operations command center with real-time KPI tracking, ML late-delivery risk predictions, SHAP explainability, automated alerts, and AI copilot." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/tracc-mark-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/tracc-mark-dark.svg" media="(prefers-color-scheme: dark)" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('metrix_theme');
          var isDark = stored ? stored === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
